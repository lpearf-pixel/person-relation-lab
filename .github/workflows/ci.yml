name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: person_relation
          POSTGRES_USER: person_relation
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U person_relation -d person_relation"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://person_relation:test-only@127.0.0.1:5432/person_relation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run verify
      - run: npm run migrate
      - run: docker build -t person-relation-lab:test .
